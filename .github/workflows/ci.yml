# Tests van de componenten bij elke push en pull request.
# Elk component dat tests krijgt, voegt hier een eigen job toe
# (pytest voor pipeline/, pgTAP voor db/, Vitest voor web/).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      # Wegwerpdatabase voor de integratietests; dezelfde hoofdversie als Supabase (17)
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: alleen-voor-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:alleen-voor-ci@localhost:5432/postgres
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python opzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Afhankelijkheden installeren
        run: pip install -r pipeline/requirements.txt -r pipeline/requirements-dev.txt

      - name: Tests van pipeline/ draaien
        # Unittests met nagebootste API-antwoorden; integratietests tegen de Postgres-container
        run: pytest pipeline -v
