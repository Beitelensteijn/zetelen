# Secret scan: faalt als er een sleutel in de code of in de git-historie staat.
# De repo is publiek, dus een sleutel die hier gevonden wordt is al uitgelekt:
# intrekken en vervangen, niet alleen verwijderen.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # Checksum van gitleaks_8.30.1_linux_x64.tar.gz uit de officiele release
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen met volledige historie
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks installeren en checksum controleren
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Historie scannen
        # Alleen de historie die bereikbaar is vanaf de gescande commit, niet alle branches:
        # anders kleurt main rood door een fout op een andere branch.
        # --redact houdt eventuele gevonden sleutels uit het (publieke) log.
        run: ./gitleaks git . --log-opts="HEAD" --redact --verbose
